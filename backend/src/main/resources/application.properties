spring.application.name=minglemart

# --- .env -------------------------------------------------------------------
# Loads ./.env (relative to the working directory) as a property source.
# `[.properties]` tells Spring how to parse an extensionless file; `optional:`
# means the app still starts when the file is absent, which is what you want in
# CI and in a container where the values arrive as real environment variables.
#
# Precedence: OS environment variables still win over this file, so an exported
# value overrides the checked-out .env rather than the other way round.
spring.config.import=optional:file:./.env[.properties]

# --- datasource -------------------------------------------------------------
# State is managed — serverless Postgres, hosted Redis, hosted RabbitMQ — and
# reached the same way from a laptop, a container, or a machine on the other
# side of the world. The names below are the app's own, so the same .env works
# both as a properties file on the host and as environment in a container.
#
# Two URLs, deliberately. The app takes the POOLED endpoint: many short
# connections, multiplexed by the provider, cheap. Flyway takes the DIRECT one,
# because its migration lock is a session-level advisory lock and a
# transaction-mode pooler does not keep sessions — run migrations through the
# pooler and two instances booting together can both believe they hold it.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/minglemart}
spring.datasource.username=${DATABASE_USER:minglemart}
spring.datasource.password=${DATABASE_PASSWORD:secret}

# Small on purpose. Every instance holds this many; N instances × this has to
# fit the plan, and serverless Postgres is least happy with idle connections
# it is being paid to keep open.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

# Nothing local to start any more, so the Compose Support starter has nothing
# to do and would only complain when Docker is not running.
spring.docker.compose.enabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- flyway -----------------------------------------------------------------
# One migration per Modulith module: V1__user, V2__catalog, ... V7__agent.
spring.flyway.enabled=true
spring.flyway.url=${DATABASE_DIRECT_URL:${spring.datasource.url}}

# db/seed carries a repeatable demo catalogue — the DummyJSON shop plus the
# grocery aisles — so a fresh database has something to render. It is
# DEVELOPMENT DATA. The default here is the safe one: migrations only. A
# development .env opts INTO the seed by naming both locations; nothing has to
# remember to opt out before the first real deployment.
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}

# --- spring modulith --------------------------------------------------------
# The event publication registry needs its own table. Modulith ships the DDL
# for each dialect, so let it create that one rather than hand-writing it into
# a Flyway migration and risking drift on upgrade.
spring.modulith.events.jdbc.schema-initialization.enabled=true

# --- actuator ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,modulith

# Mail is deliberately not part of the health verdict. Notifications are an
# outbox drained by NotificationDispatchJob, so an unreachable SMTP relay delays
# delivery rather than stopping the application serving requests — and a
# container orchestrator reading /actuator/health should not restart a healthy
# app because Mailpit is down.
management.health.mail.enabled=false

# --- request logging --------------------------------------------------------
# One line per request: method, path, status, duration. Off by default — it is
# what you want while watching a dev stack and not what you want filling a
# production log. compose.yaml turns it on for the containerised stack.
minglemart.http.log-requests=${HTTP_LOG_REQUESTS:false}

# --- scheduler --------------------------------------------------------------
# Whether THIS process runs the clock-driven work: outbox drains, timeout
# sweeps, alarms. Defaults to true so a single `./mvnw spring-boot:run` still
# does everything.
#
# Set false on an API instance and true on the worker. A sweep that ran on
# every replica would time out the same proposal twice and raise every alarm
# from every instance, so exactly one process should own the clock.
minglemart.scheduler.enabled=${SCHEDULER_ENABLED:true}

# --- jobs -------------------------------------------------------------------
# Whether THIS process consumes the RabbitMQ job queues: capture a payment
# after a pick, release a hold, unwind an abandoned pick. Laravel's
# `queue:work`, in effect.
#
# Unlike the scheduler, more than one consumer is fine — competing consumers on
# a durable queue is the whole point of a queue — so this may be true on
# several workers at once. It is false on API instances so that the web tier
# never talks to Stripe except at checkout, when the shopper is present.
minglemart.jobs.enabled=${JOBS_ENABLED:true}

# --- rabbitmq ---------------------------------------------------------------
# A consumer that throws gets the message back twice more, with backoff, and
# then the message goes to the dead-letter exchange rather than round again
# forever. Laravel's $tries = 3 and backoff(). Global, which is fine: the only
# non-job listener is the SSE stream, whose queue has no dead-letter exchange,
# so a rejected stream message simply drops — which is what it should do.
# Hosted RabbitMQ: TLS on 5671, a vhost that is usually the username, and a
# password. Local: the defaults.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}

spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2

# An in-process listener that failed leaves its event_publication row
# incomplete. Re-run those on boot, and let the scheduler sweep the ones that
# got stuck while running.
# On the scheduler only. Three web replicas restarting together would
# otherwise replay every incomplete publication three times — harmless, since
# the listeners are idempotent, but waste nobody needs to pay for.
spring.modulith.republish-outstanding-events-on-restart=${SCHEDULER_ENABLED:true}

# --- redis / caching --------------------------------------------------------
# Hosted Redis speaks TLS and wants a password; a local one wants neither. The
# defaults are the local case, and a hosted .env sets all four.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
# Short, and deliberately so: a slow cache must not become a slow request. The
# RedisStore turns a timeout into a miss rather than an error.
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# Redis holds a cache, not a system of record, and RedisStore fails open — so a
# Redis outage makes requests slower, not broken. Keeping it out of the health
# verdict stops an orchestrator restarting perfectly healthy instances because
# the cache blinked. Revisit this when Redis also holds sessions or agent locks.
management.health.redis.enabled=false

# Modules are declared with @ApplicationModule on package-info, which lets
# them live at any nesting depth rather than only as direct sub-packages.
spring.modulith.detection-strategy=explicitly-annotated

# --- tokens -----------------------------------------------------------------
# Access token: JWT, short-lived, cannot be revoked before expiry.
# Refresh token: opaque + rolling, revocable because it is a `sessions` row.
minglemart.token.secret=${MINGLEMART_TOKEN_SECRET:dev-only-secret-change-me-min-32-bytes!!}
minglemart.token.access-ttl=15m
minglemart.token.refresh-ttl=30d
minglemart.token.issuer=minglemart
minglemart.token.secure-cookies=false

# --- oauth ------------------------------------------------------------------
# Audience checked on every Google ID token. Unset means every token is rejected.
minglemart.oauth.google.client-id=${GOOGLE_CLIENT_ID:}

# --- app --------------------------------------------------------------------
# Base URL used to build emailed links (verification, password reset).
minglemart.app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# --- cors -------------------------------------------------------------------
# Browser origins allowed to call /api/** with credentials. Comma-separated, and
# exact — a credentialed request cannot be answered with a wildcard origin.
# Defaults to the frontend URL above, which is the only origin in development.
minglemart.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173}}

# --- mail (SMTP) ------------------------------------------------------------
# Point at Mailpit/MailHog locally (docker run -p 1025:1025 -p 8025:8025 axllent/mailpit)
# and at a real relay in production. Nothing in code changes between the two.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
minglemart.mail.from=${MAIL_FROM:no-reply@minglemart.local}
minglemart.mail.from-name=${MAIL_FROM_NAME:MingleMart}
